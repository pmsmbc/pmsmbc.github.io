<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>박진우 포트폴리오</title>
    <meta name="description" content="AI를 업무에 활용하는 웹 퍼블리셔·프론트엔드 개발자 박진우의 포트폴리오" />
    <meta property="og:title" content="박진우 포트폴리오" />
    <meta property="og:description" content="AI로 초안을 빠르게, 마무리는 직접 꼼꼼하게." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pmsmbc.github.io/" />
    <link rel="canonical" href="https://pmsmbc.github.io/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
